<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rzxxy Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
        }

        .hero {
            padding: 100px 20px;
        }

        h1 {
            font-size: 42px;
        }

        p {
            color: #aaa;
            font-size: 18px;
        }

        button {
            background: #00ffff;
            color: black;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
        }

        footer {
            padding: 30px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        RZXXY
    </header>

    <section class="hero">

        <h1>Welcome to My Website</h1>

        <p>
            My first website built with GitHub and Vercel.
        </p>

        <button onclick="showMessage()">
            Get Started
        </button>

        <p id="message"></p>

    </section>

    <footer>
        © 2026 Rzxxy. All rights reserved.
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Welcome! Website is working!";
        }
    </script>

</body>
</html>
